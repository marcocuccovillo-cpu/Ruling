name: Pubblica sito

# Scarica il database delle carte e pubblica il sito su GitHub Pages.
# Richiede: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # ogni lunedì, per avere le carte nuove

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica il database delle carte
        run: node scripts/build-cards.mjs data
      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html style.css app.js sw.js manifest.webmanifest .nojekyll icons vendor faq knowledge data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
